name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ["1.24", "1.25", "1.26"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Test root module
        run: go test -v -short -timeout 300s ./...

      - name: Test cmd/protoc-gen-arena/testdata/wiretest
        working-directory: cmd/protoc-gen-arena/testdata/wiretest
        run: go test -v -short -timeout 120s ./...
